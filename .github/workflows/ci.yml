name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  typecheck:
    name: TypeScript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - name: First-connection token budget
        run: npx tsx scripts/first-connection-audit.ts
      # Every file in test/ is pure logic (no network, no D1, no wrangler dev).
      # Added in Fase 25.4 so the alert noise floor can't regress silently.
      - name: Unit tests
        run: |
          for t in test/*.ts; do
            echo "--- $t"
            npx tsx "$t"
          done

  # Glama builds with `pnpm install` and starts with `pnpm run start` under
  # mcp-proxy. A newer pnpm that refuses the install (ignored build scripts) or
  # prints to stdout would kill its container before the first ping, so run the
  # same two commands with the latest pnpm and demand a clean JSON-RPC reply.
  glama-start:
    name: Glama start (pnpm)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: npm install -g pnpm@latest
      - run: pnpm install
      - name: initialize + tools/list over stdio, stdout must be pure JSON-RPC
        run: |
          printf '%s\n' \
            '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"ci","version":"1"}}}' \
            '{"jsonrpc":"2.0","method":"notifications/initialized"}' \
            '{"jsonrpc":"2.0","id":2,"method":"tools/list"}' \
          | pnpm run start 2>/dev/null > stdio.out
          node -e '
            const l = require("fs").readFileSync("stdio.out","utf8").trim().split("\n").map(JSON.parse);
            if (l.length !== 2 || l[0].id !== 1 || !l[1].result.tools.length) { console.error(l); process.exit(1); }
            console.log("ok:", l[1].result.tools.length, "tools");
          '
