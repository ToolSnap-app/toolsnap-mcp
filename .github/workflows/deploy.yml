name: Deploy

# A12 of the security plan (2026-10-28): build and deploy are two jobs.
#
# `build` has NO secrets and is the only job that runs npm install scripts
# (astro, sharp, esbuild, workerd...): a malicious postinstall here finds
# nothing to steal. It also typechecks, so a type error blocks the deploy.
# `deploy` runs in the `production` environment (only main can use it, so a
# workflow edited on another branch cannot read the token), installs the root
# deps with `--ignore-scripts` (verified: wrangler bundles the Worker fine
# without them, esbuild's binary comes as an optional dependency), takes the
# built site from the artifact and publishes with the lockfile's wrangler.
# `account_id` lives in wrangler.jsonc, as account-owned tokens require.

on:
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    name: Typecheck + build site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm ci --prefix site
      - run: npm run typecheck
      - run: npm run build:site

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: site-dist
          path: site/dist
          if-no-files-found: error
          retention-days: 1

  # A16 (2026-10-30): toolsnap-x-personal holds the personal X account's
  # tokens (workers/x-personal). It goes BEFORE the main deploy because
  # toolsnap-mcp's X_PERSONAL service binding points at it. Its own token
  # (Editor on that Worker only, no zone permissions: it has no route, no
  # domain, no workers.dev) so this job never sees toolsnap-mcp's token and
  # vice versa. No HTTP smoke test on purpose: the Worker answers 404 to
  # everything; the main job's smoke test boots toolsnap-mcp with the binding.
  deploy-x-personal:
    name: Deploy toolsnap-x-personal
    needs: build
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      # No install scripts next to the token (see the header comment).
      - run: npm ci --ignore-scripts

      - name: Deploy toolsnap-x-personal
        run: npx wrangler deploy --config workers/x-personal/wrangler.jsonc
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN_X_PERSONAL }}

  deploy:
    name: Deploy Worker
    needs: [build, deploy-x-personal]
    runs-on: ubuntu-latest
    # CLOUDFLARE_API_TOKEN lives in this environment, which only main can
    # use, so a workflow edited on another branch cannot read it.
    environment: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: site-dist
          path: site/dist

      # No install scripts next to the token (see the header comment).
      - run: npm ci --ignore-scripts

      - name: Deploy Worker
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      # A14: registra el deployment recien hecho como ESPERADO en KV, para que
      # la vigilancia de despliegues (src/alerts/deploy-watch.ts) distinga este
      # deploy de uno hecho a mano (y un rollback, que reutiliza versiones). Necesita que el token tenga Workers KV
      # Storage Edit; sin el, el paso avisa pero no corta los smoke tests (el
      # deploy ya esta hecho) y la vigilancia lanzara una alerta por este deployment.
      - name: Register deployment as expected
        continue-on-error: true
        run: bash scripts/registrar-deploy.sh toolsnap-mcp
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      # Post-deploy smoke test: a real MCP initialize against production.
      # Catches routing regressions the asset router can cause (2026-07-07:
      # /mcp returned a bare 405 for a day because run_worker_first didn't
      # list it — every MCP client saw "Server disconnected"). Retries to
      # ride out edge propagation after the deploy.
      - name: Smoke test /mcp (initialize + tools/list)
        run: |
          set -euo pipefail
          for i in 1 2 3 4 5; do
            code=$(curl -sS -o /tmp/init.json -w '%{http_code}' -X POST https://mcp.toolsnap.app/mcp \
              -H 'content-type: application/json' -H 'accept: application/json, text/event-stream' \
              --data '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"ci-smoke","version":"1.0"}}}' \
              --max-time 20 || echo 000)
            if [ "$code" = "200" ] && grep -q '"serverInfo"' /tmp/init.json; then break; fi
            echo "attempt $i: HTTP $code — retrying in 10s"; sleep 10
            if [ "$i" = "5" ]; then echo "::error::POST /mcp initialize failed after deploy (HTTP $code)"; cat /tmp/init.json; exit 1; fi
          done
          curl -sSf -X POST https://mcp.toolsnap.app/mcp \
            -H 'content-type: application/json' -H 'accept: application/json, text/event-stream' \
            --data '{"jsonrpc":"2.0","id":2,"method":"tools/list"}' --max-time 20 | grep -q '"tools"'
          curl -sSf https://mcp.toolsnap.app/.well-known/mcp.json --max-time 20 >/dev/null
          echo "smoke test OK: /mcp initialize + tools/list + .well-known"

      # Fase 26 (OAuth 2.1 + DCR) — the anonymous /mcp door above must stay
      # untouched; this checks the ADDITIVE /mcp/oauth door + discovery.
      # Resource server (this Worker) + authorization server (toolsnap-portal,
      # deployed separately) are both checked here since a break in either
      # breaks the whole OAuth connect flow.
      - name: Smoke test OAuth discovery + /mcp/oauth gate
        run: |
          set -euo pipefail
          check() {
            curl -sSf https://mcp.toolsnap.app/.well-known/oauth-protected-resource --max-time 20 | grep -q '"authorization_servers"'
            curl -sSf https://mcp.toolsnap.app/.well-known/oauth-protected-resource/mcp/oauth --max-time 20 | grep -q '"https://mcp.toolsnap.app/mcp/oauth"'
            curl -sSf https://portal.toolsnap.app/.well-known/oauth-authorization-server --max-time 20 | grep -q '"registration_endpoint"'
            code=$(curl -sS -o /tmp/oauth-401.json -w '%{http_code}' -D /tmp/oauth-401.headers -X POST https://mcp.toolsnap.app/mcp/oauth \
              -H 'content-type: application/json' \
              --data '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{}}' --max-time 20)
            [ "$code" = "401" ]
            grep -qi '^www-authenticate:' /tmp/oauth-401.headers
            # Plain /mcp must stay anonymous-friendly — OAuth is additive, not a replacement.
            curl -sSf -X POST https://mcp.toolsnap.app/mcp \
              -H 'content-type: application/json' \
              --data '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","clientInfo":{"name":"ci-smoke-oauth","version":"1.0"}}}' \
              --max-time 20 | grep -q '"serverInfo"'
          }
          # Same edge-propagation retry as the /mcp smoke test above — a fresh
          # deploy can briefly 404 on some PoPs before the new Worker version
          # is fully propagated (observed in production, Fase 26 first deploy).
          for i in 1 2 3 4 5; do
            if check; then echo "smoke test OK: OAuth discovery + /mcp/oauth 401 gate + /mcp still anonymous"; exit 0; fi
            echo "attempt $i: OAuth smoke check failed — retrying in 10s"; sleep 10
          done
          echo "::error::OAuth smoke test failed after retries"; exit 1
