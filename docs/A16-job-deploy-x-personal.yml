# A16 — job PROPUESTO para .github/workflows/deploy.yml (no es un workflow:
# GitHub solo lee .github/workflows/). Lo integra la sesión principal, que es
# la que está tocando los workflows.
#
# Va entre `build` y `deploy`: el Worker principal tiene un service binding
# (X_PERSONAL) a toolsnap-x-personal, así que este tiene que estar publicado
# antes. En el job `deploy` existente hay que cambiar `needs: build` por
#   needs: [build, deploy-x-personal]
#
# Token propio (como A3, uno por Worker): token de CUENTA ToolSnap, Editor solo
# sobre el Worker `toolsnap-x-personal`, SIN permisos de zona (no tiene ruta,
# ni dominio, ni workers.dev), caducidad 6 meses. Se guarda con
#   gh secret set CLOUDFLARE_API_TOKEN_X_PERSONAL --env production -R ToolSnap-app/toolsnap-mcp
# Cada job lee solo su token: este nunca ve el de toolsnap-mcp ni al revés.
#
# Sin smoke test HTTP a propósito: el Worker no tiene puerta pública (contesta
# 404 a todo). La prueba real es el smoke test del job `deploy` (el Worker
# principal arranca con el binding) y la primera publicación personal.

  deploy-x-personal:
    name: Deploy toolsnap-x-personal
    needs: build
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      # Sin install scripts al lado del token (A12), igual que `deploy`.
      - run: npm ci --ignore-scripts

      - name: Deploy toolsnap-x-personal
        run: npx wrangler deploy --config workers/x-personal/wrangler.jsonc
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN_X_PERSONAL }}
