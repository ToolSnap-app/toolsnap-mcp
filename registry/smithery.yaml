name: toolsnap-mcp
displayName: "ToolSnap MCP — Context-Efficient Microtools"
description: |
  Deterministic, context-efficient microtools for AI agents. 47 tools total, 36 free;
  tools/list shows a curated core of 17 and the rest is one free tool_catalog call away.
  Free flagships: fetch_extract (median 98.1% token reduction, 53,820 → 2,001 tokens,
  11 real pages) and fetch_html, plus PDF/CSV/JSON queries, HTML→Markdown, sitemaps,
  feeds, metadata, link checking and utilities.
  11 paid tools with real per-call cost (no first-call-free): screenshot_url,
  fetch_rendered, keyword_research ($0.04), remove_background ($0.03), fal.ai media
  tools (from $0.02; video from $0.08) and csv/json_query_xl ($0.02). USDC on Base via
  x402, prepaid balance (~33-38% cheaper), or card credits. Calling a paid tool without
  payment returns a structured 402 with payment options — expected, not a broken tool.

